name: tfsec

on:
  push:
    branches: [ "prod", "dev", "staging" ]
  pull_request:
    branches: [ "prod" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  tfsec:
    name: tfsec-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec (SARIF for Security tab)
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif

      - name: Fail on HIGH/CRITICAL findings
        run: |
          COUNT=$(jq '[.runs[].results[] | select(.level=="error")] | length' tfsec.sarif)
          echo "=============================================="
          echo "tfsec error-level (HIGH/CRITICAL) findings: $COUNT"
          echo "=============================================="
          if [ "$COUNT" -gt 0 ]; then
            jq -r '.runs[].results[] | select(.level=="error") | "[FAIL] \(.ruleId)\n       \(.message.text)"' tfsec.sarif
            echo ""
            echo "Blocking merge: $COUNT security issue(s) must be fixed."
            exit 1
          fi
          echo "All HIGH/CRITICAL checks passed."
